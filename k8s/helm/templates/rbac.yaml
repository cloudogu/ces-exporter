apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ces-exporter.name" . }}
  labels:
    {{- include "ces-exporter.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ces-exporter.name" . }}-role
  labels:
    {{- include "ces-exporter.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - list
      - get
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
  - apiGroups:
      - "k8s.cloudogu.com"
    resources:
      - components
    verbs:
      - list
  - apiGroups:
      - "k8s.cloudogu.com"
      - "k8s.cloudogu.com/v1"
    resources:
      - backupschedules
    verbs:
      - list
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ces-exporter.name" . }}-role-binding
  labels:
    {{- include "ces-exporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ces-exporter.name" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "ces-exporter.name" . }}
    namespace: '{{ .Release.Namespace }}'