apiVersion: v1
kind: Service
metadata:
  name: {{ include "ces-exporter.name" . }}-dogu-exporter
  labels:
    {{- include "ces-exporter.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: ssh-exporter
      port: 7022
      targetPort: 7022
  selector:
    dogu.name: "not_defined"