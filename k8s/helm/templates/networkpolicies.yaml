{{- if .Values.global.networkPolicies.enabled }}
---
# This NetworkPolicy allows ingress to ces-exporter from the ingress-controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-ingress-controller" (include "ces-exporter.name" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ces-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: ces
      {{- include "ces-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
{{- end }}